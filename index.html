// ========== LIBRARY HEALTH CHECK (2.4) ==========
// Scans each local series' episode list and reports three classes of issue:
//   - Missing: gaps in sequential episode numbers (has 1,2,3,5 → 4 missing)
//   - Duplicates: two+ files resolving to the same episode number
//   - Orphans: files whose episode number couldn't be parsed
// Pure frontend — works off S.lib, which is already loaded.
function _hcAnalyzeSeries(s){
  var eps=s.episodes||[];
  var numbered={},orphans=[];
  eps.forEach(function(ep){
    if(ep.episodeNum===null||ep.episodeNum===undefined||isNaN(ep.episodeNum)){orphans.push(ep);return;}
    var key=ep.episodeNum;(numbered[key]=numbered[key]||[]).push(ep);
  });
  // Duplicates
  var dups=[];
  Object.keys(numbered).forEach(function(k){if(numbered[k].length>1)dups.push({num:parseFloat(k),files:numbered[k]});});
  // Missing (only if we have enough signal — at least two numbered eps and a reasonable range)
  var nums=Object.keys(numbered).map(parseFloat).filter(function(n){return !isNaN(n)});
  var missing=[];
  if(nums.length>=2){
    var min=Math.min.apply(null,nums),max=Math.max.apply(null,nums);
    // Only whole-number gaps — don't flag fractional chapter numbers as missing.
    for(var n=Math.floor(min);n<=Math.ceil(max);n++){
      if(!numbered[n]&&!numbered[n+'.0']&&!numbered[String(n)])missing.push(n);
    }
    // Sanity: if too many "missing" relative to total, this is probably a
    // movies/special folder — don't pollute the report.
    if(missing.length>nums.length*2)missing=[];
  }
  return {missing:missing,duplicates:dups,orphans:orphans};
}
async function runHealthCheck(){
  var all=(S.lib||[]).filter(function(s){return !s.name.startsWith('__unsorted')});
  if(!all.length){if(notifEnabled('healthCheck'))toast('Library is empty','i');return;}
  if(notifEnabled('healthCheck'))toast('Running health check...','i');
  var reports=[];var totalMissing=0,totalDup=0,totalOrphan=0,cleanCount=0;
  all.forEach(function(s){
    var r=_hcAnalyzeSeries(s);
    var issues=r.missing.length+r.duplicates.length+r.orphans.length;
    if(issues>0){reports.push({series:s,report:r});totalMissing+=r.missing.length;totalDup+=r.duplicates.length;totalOrphan+=r.orphans.length;}
    else cleanCount++;
  });
  // Sort: most issues first
  reports.sort(function(a,b){
    var ai=a.report.missing.length+a.report.duplicates.length+a.report.orphans.length;
    var bi=b.report.missing.length+b.report.duplicates.length+b.report.orphans.length;
    return bi-ai;
  });
  var hasIssues=reports.length>0;
  if(notifEnabled('healthCheck')){
    if(hasIssues){
      toast('Health check complete — '+totalMissing+' missing, '+totalDup+' duplicates, '+totalOrphan+' orphan files found','e');
    } else {
      toast('Health check complete — library is healthy ('+cleanCount+'/'+(isManga()?all.length+' series clean)':'all clean)'),'s');
    }
  }
  _renderHealthCheckModal(reports,{clean:cleanCount,total:all.length,totalMissing:totalMissing,totalDup:totalDup,totalOrphan:totalOrphan});
}
function _renderHealthCheckModal(reports,summary){
  var h='<div class="mal-edit-overlay" onclick="if(event.target===this)_closeHealthCheck()">'
    +'<div class="mal-edit-panel" style="width:720px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column">'
    +'<h3>🩺 Library Health Check</h3>'
    +'<div class="hc-summary">'
    +'<span><strong>'+summary.total+'</strong> series scanned</span>'
    +'<span style="color:var(--green)"><strong>'+summary.clean+'</strong> clean</span>'
    +(summary.totalMissing?'<span style="color:var(--yellow)"><strong>'+summary.totalMissing+'</strong> missing '+(isManga()?'chapters':'episodes')+'</span>':'')
    +(summary.totalDup?'<span style="color:var(--red)"><strong>'+summary.totalDup+'</strong> duplicates</span>':'')
    +(summary.totalOrphan?'<span style="color:var(--blue)"><strong>'+summary.totalOrphan+'</strong> unparseable files</span>':'')
    +'</div>';
  if(!reports.length){
    h+='<div style="padding:24px;text-align:center;color:var(--green);font-size:14px">✓ No issues found — your library looks healthy.</div>';
  } else {
    h+='<div class="hc-report">';
    reports.forEach(function(r,i){
      var s=r.series,rep=r.report;
      var key='hc-row-'+i;
      h+='<div class="hc-row" id="'+key+'"><div class="hc-row-head" onclick="document.getElementById(\''+key+'\').classList.toggle(\'open\')">'
        +'<span class="hc-caret">▶</span>'
        +'<span class="hc-row-name">'+E(s.name)+'</span>'
        +'<div class="hc-row-chips">';
      if(rep.missing.length)h+='<span class="hc-chip missing">'+rep.missing.length+' missing</span>';
      if(rep.duplicates.length)h+='<span class="hc-chip dup">'+rep.duplicates.length+' dup</span>';
      if(rep.orphans.length)h+='<span class="hc-chip orphan">'+rep.orphans.length+' orphan</span>';
      h+='</div></div><div class="hc-row-body">';
      if(rep.missing.length){
        h+='<div class="hc-section-label">Missing '+(isManga()?'chapters':'episodes')+'</div><ul class="hc-list">';
        rep.missing.forEach(function(n){h+='<li class="bad">'+(isManga()?'Ch':'Ep')+' '+n+'</li>';});
        h+='</ul>';
      }
      if(rep.duplicates.length){
        h+='<div class="hc-section-label">Duplicates</div><ul class="hc-list">';
        rep.duplicates.forEach(function(d){
          h+='<li class="worse">'+(isManga()?'Ch':'Ep')+' '+d.num+': '+d.files.length+' files</li>';
          d.files.forEach(function(f){h+='<li style="padding-left:14px;opacity:.7">'+E(f.name)+'</li>';});
        });
        h+='</ul>';
      }
      if(rep.orphans.length){
        h+='<div class="hc-section-label">Unparseable filenames</div><ul class="hc-list">';
        rep.orphans.forEach(function(f){h+='<li>'+E(f.name)+'</li>';});
        h+='</ul>';
      }
      h+='<div style="margin-top:10px;display:flex;gap:8px">'
        +'<button class="btn btn-s btn-xs" data-hc-open="'+E(s.path)+'">📂 Open folder</button>'
        +'</div></div></div>';
    });
    h+='</div>';
  }
  h+='<div class="mal-edit-actions" style="margin-top:12px"><button class="btn btn-s btn-sm" onclick="_closeHealthCheck()">Close</button></div>';
  h+='</div></div>';
  var div=document.createElement('div');div.id='hcOverlay';div.innerHTML=h;document.body.appendChild(div);
  // Wire folder-open buttons via delegation (avoids J() escaping on paths with quotes/brackets)
  div.addEventListener('click',function(e){
    var btn=e.target.closest('[data-hc-open]');
    if(btn){var p=btn.getAttribute('data-hc-open');if(p)api.openFolder(p);}
  });
}
function _closeHealthCheck(){var el=document.getElementById('hcOverlay');if(el)el.remove();}

// Initialize background effects on startup
document.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){initBackgroundEffects();},100);
});

init();
</script>
<!-- ====== DUPLICATE FILE RESOLUTION POPUP (lower-right, toast-style) ====== -->
<div id="dupPopup" class="dup-popup" style="display:none">
  <div class="dup-popup-h">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="dup-popup-warn">&#x26A0;</div>
      <div>
        <div class="dup-popup-t">Duplicate Files</div>
        <div class="dup-popup-d">Multiple files for the same episode</div>
      </div>
    </div>
    <button class="dup-popup-x" onclick="dismissDupPopup()">&#x2715;</button>
  </div>
  <div class="dup-popup-info">
    <div class="dup-popup-sn" id="dupPopupSeriesName">-</div>
    <div class="dup-popup-en">Episode <span id="dupPopupEpisodeNum">-</span></div>
  </div>
  <div class="dup-popup-files" id="dupPopupFilesList"></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-p btn-xs" onclick="resolveDupPreferHEVC()" style="font-size:11px;padding:5px 10px">Prefer HEVC</button>
    <button class="btn btn-p btn-xs" onclick="resolveDupPreferLarger()" style="font-size:11px;padding:5px 10px">Prefer Larger</button>
    <button class="btn btn-s btn-xs" onclick="resolveDupManual()" style="font-size:11px;padding:5px 10px">Keep Selected</button>
    <div style="flex:1"></div>
    <button class="btn btn-d btn-xs" onclick="dismissDupPopup()" style="font-size:11px;padding:5px 10px">Dismiss</button>
  </div>
</div>
