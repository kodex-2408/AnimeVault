// Episode/chapter number parsers (mirror main.js for renderer use)
function parseEpisodeNumber(filename){
  var base=filename.replace(/\.[^.]+$/,'');
  var cleaned=base.replace(/\b(?:Season\s*\d{1,2}|S\d{1,2})\b/gi,'');
  cleaned=cleaned.replace(/\s*[\[\(]\s*(?:19|20)\d{2}\s*[\]\)]\s*/g,'');
  cleaned=cleaned.replace(/\s+/g,' ').trim();
  // Pattern 1: S01E05
  var m=cleaned.match(/S\d{1,2}E(\d{1,3})/i);
  if(m)return parseInt(m[1]);
  // Pattern 2: Episode 05, EP 05
  m=cleaned.match(/Episode\s+(\d{1,3})/i);
  if(m)return parseInt(m[1]);
  m=cleaned.match(/\bEP?\s*(\d{1,3})\b/i);
  if(m)return parseInt(m[1]);
  // Pattern 3: - 05 (dash-separated)
  m=cleaned.match(/-\s*(\d{1,3})(?:v\d)?(?:\s*(?:\[|\(|\.|$))/);
  if(m)return parseInt(m[1]);
  // Pattern 3b: NUMBER - text (number followed by dash then non-digit)
  m=cleaned.match(/(\d{1,3})\s*[-–—]\s*\D/);
  if(m)return parseInt(m[1]);
  // Pattern 4: rightmost standalone number not followed by dash
  var candidates=[];
  var p4regex=/\s+(\d{1,3})(?:v\d)?(?=\s|$|\[|\(|\.)/g;
  var p4m;
  while((p4m=p4regex.exec(cleaned))!==null){
    var rest=cleaned.slice(p4regex.lastIndex);
    if(!/^\s*[-–—]/.test(rest)) candidates.push(parseInt(p4m[1]));
  }
  if(candidates.length)return candidates[candidates.length-1];
  // Fallback: number at end
  m=cleaned.match(/\b(\d{1,3})\s*$/);
  if(m)return parseInt(m[1]);
  return null;
}
function parseChapterNumber(filename){
  var base=filename.replace(/\.[^.]+$/,'');
  var m=base.match(/(?:Ch(?:apter)?[.\s]*(\d{1,4})|Ch\s*(\d{1,4})|C\s*(\d{1,4})|#(\d{1,4})|-\s*(\d{1,4})(?:v\d)?\s*[\[\(\.\s]|\s+(\d{1,4})(?:v\d)?\s*[\[\(\.\s])/i);
  if(m)return parseInt(m[1]||m[2]||m[3]||m[4]||m[5]||m[6]);
  m=base.match(/\b(\d{1,4})\s*$/);
  if(m)return parseInt(m[1]);
  return null;
}

function getMyListStatus(md){
  if(!md)return null;
  if(md.my_list_status)return md.my_list_status;
  var hasAny=md.status||md.score!=null||md.num_episodes_watched!=null||md.num_watched_episodes!=null||md.num_chapters_read!=null;
  if(!hasAny)return null;
  return {
    status:md.status,

    num_episodes_watched:md.num_episodes_watched!=null?md.num_episodes_watched:(md.num_watched_episodes!=null?md.num_watched_episodes:0),
    num_chapters_read:md.num_chapters_read
  };
}

function toast(msg,type,actionOrActions){
  var c=document.getElementById('tc');var e=document.createElement('div');
  var isError=type==='e';
  e.className='toast toast-'+(type==='s'?'s':isError?'e':'i');
  var dur=isError?8000:4000;
  var icon=type==='s'?'✓':isError?'✗':'ℹ';
  var iconColor=type==='s'?'var(--green)':isError?'var(--red)':'var(--blue)';
  var html='<span style="color:'+iconColor+';font-size:15px;font-weight:700;flex-shrink:0;width:22px;text-align:center;line-height:1">'+icon+'</span><span style="flex:1;min-width:0">'+E(msg)+'</span>';
  // Support single action (backward compat) or array of actions
  var actions=Array.isArray(actionOrActions)?actionOrActions:(actionOrActions?[actionOrActions]:[]);
  actions.forEach(function(a){if(a&&a.label){
    html+='<button class="toast-action" onclick="event.stopPropagation();this.closest(\'.toast\').remove();('+a.onClick.toString()+')()">'+(a.label)+'</button>';
  }});
  html+='<button class="toast-close" onclick="this.closest(\'.toast\').remove()">✕</button>';
  e.innerHTML=html;
  c.appendChild(e);setTimeout(function(){e.style.transition='opacity .3s';e.style.opacity='0';setTimeout(function(){e.remove()},300)},dur);
}

function applyTheme(){
  var themeId=S.cfg.fullTheme||'pearl';
  var ft=FULL_THEMES.find(function(t){return t.id===themeId})||FULL_THEMES.find(function(t){return t.id==='pearl'})||FULL_THEMES[0];
  var accent=S.cfg.accentColor||'#eaa32a';
  // Apply light/dark class
  document.documentElement.classList.toggle('light',!ft.dark);
  // Apply accent
  document.documentElement.style.setProperty('--accent',accent);
  var r=parseInt(accent.slice(1,3),16),g=parseInt(accent.slice(3,5),16),b=parseInt(accent.slice(5,7),16);
  document.documentElement.style.setProperty('--accent-light','rgb('+Math.min(r+40,255)+','+Math.min(g+40,255)+','+Math.min(b+40,255)+')');
  document.documentElement.style.setProperty('--accent-glow','rgba('+r+','+g+','+b+',.25)');
  document.documentElement.style.setProperty('--accent-subtle','rgba('+r+','+g+','+b+',.08)');
  // Apply all theme colors
  document.documentElement.style.setProperty('--bg-deep',ft.bgDeep);
  document.documentElement.style.setProperty('--bg-base',ft.bgBase);
  document.documentElement.style.setProperty('--bg-raised',ft.bgRaised);
  document.documentElement.style.setProperty('--bg-surface',ft.bgSurface);
  document.documentElement.style.setProperty('--text-primary',ft.textPrimary);
  document.documentElement.style.setProperty('--text-secondary',ft.textSecondary);
  document.documentElement.style.setProperty('--text-tertiary',ft.textTertiary);
  document.documentElement.style.setProperty('--border',ft.border);
  document.documentElement.style.setProperty('--border-light',ft.borderLight);
  // Hover bg depends on light/dark
  document.documentElement.style.setProperty('--bg-hover',ft.dark?'rgba(255,255,255,.06)':'rgba(0,0,0,.04)');
  // Font
  var fontToUse=S.cfg.fontFamily||'Segoe UI';
  document.documentElement.style.setProperty('--font-display',fontToUse);
  // Gradient bg
  if(ft.gradient){document.body.style.background=ft.gradient;document.body.style.backgroundAttachment='fixed';}
  else{document.body.style.background=ft.bgDeep;document.body.style.backgroundAttachment='';}
}

    api.setConfig('autoMarkEnabled',true);
  }
  S.mal=await api.malIsAuthenticated();
  S.watcherStatus=await api.watcherStatus();
  S.watcherLog=[];
  // Restore vault mode
  S.vaultMode=S.cfg.vaultMode||'anime';
  document.getElementById('modeAnime').classList.toggle('active',S.vaultMode==='anime');
  document.getElementById('modeManga').classList.toggle('active',S.vaultMode==='manga');
  document.getElementById('appTitle').textContent=isManga()?'MangaVault':'AnimeVault';
  updateSidebarLabels();
  uMal();applyTheme();
  // Apply saved animation speed
  if(S.cfg.animSpeed)setAnimSpeed(S.cfg.animSpeed);
  // Listen for new files from watcher
  api.onNewFiles(function(files){
    // Split into: files for existing series (auto-moved) vs new series needing a destination prompt
    var autoMoved=files.filter(function(f){return !f.isNewSeries});
    var newSeries=files.filter(function(f){return f.isNewSeries});
    // Auto-moved: add to log and rescan silently
    if(autoMoved.length){
      autoMoved.forEach(function(f){S.watcherLog.unshift(f);});
      if(S.watcherLog.length>20)S.watcherLog=S.watcherLog.slice(0,20);
      if(notifEnabled('watcher'))toast(autoMoved.length+' file'+(autoMoved.length>1?'s':'')+' organized','s');
      loadLib();
    }
    // New series: group by series name and add to pending prompt list
    if(newSeries.length){
      var grouped={};
      newSeries.forEach(function(f){
        if(!grouped[f.series])grouped[f.series]={series:f.series,files:[]};
        grouped[f.series].files.push(f);
      });
      Object.values(grouped).forEach(function(item){
        // Don't add duplicates
        if(!S.pendingNewSeries.find(function(p){return p.series===item.series;})){
          S.pendingNewSeries.push(item);
        }
      });
      if(notifEnabled('watcher')){
        // Show a rich placement toast for each new series with inline "Place in" buttons
        Object.values(grouped).forEach(function(item){
          showPlacementToast(item);
        });
      }
      // Also show in File Management tab if user is already there
      S.fmTab='watch';
      if(S.view==='filemgmt')render();
    }
  });
  // Listen for auto-download poll completion (scheduled + manual polls)
  if(typeof api.onAutoDownloadPollComplete==='function'){
    api.onAutoDownloadPollComplete(function(results){
      if(!results) return;
      var total=(results.downloaded||[]).length+(results.no_results||[]).length+(results.no_exact_match||[]).length+(results.dedup||[]).length+(results.skipped_local||[]).length+(results.error||[]).length;
      if(!total) return;
      if(notifEnabled('autoDownload')){
        if(results.downloaded && results.downloaded.length){
          results.downloaded.forEach(function(d){
            toast('Auto-downloaded '+epLabel()+' '+d.episode+' of '+d.series+' ('+d.seeders+' seeds)','s');
          });
        }
        if(results.skipped_local && results.skipped_local.length){
          results.skipped_local.forEach(function(s){
            toast('Skipped: '+s.series+' — already have '+epLabel()+' '+s.episode+' (local highest: '+s.localHighest+')','i');
          });
        }
        if(results.dedup && results.dedup.length){
          results.dedup.forEach(function(d){
            toast('Skipped: '+d.series+' '+epLabel()+' '+d.episode+' — downloaded '+d.minutesAgo+' min ago','i');
          });
        }
        if(results.no_results && results.no_results.length){
          if(results.no_results.length===1){
            toast('No Nyaa results for '+results.no_results[0].series+' '+epLabel()+' '+results.no_results[0].episode,'i');
          } else {
            toast('No Nyaa results for '+results.no_results.length+' series','i');
          }
        }
        if(results.no_exact_match && results.no_exact_match.length){
          if(results.no_exact_match.length===1){
            toast('No exact episode match for '+results.no_exact_match[0].series+' '+epLabel()+' '+results.no_exact_match[0].episode,'i');
          } else {
            toast('No exact episode matches for '+results.no_exact_match.length+' series','i');
          }
        }
        if(results.error && results.error.length){
          results.error.forEach(function(e){
            toast('Auto-download error: '+e.series+' — '+e.error,'e');
          });
        }
      }
    });
  }

  // Desktop notifications (Batch A F1)
  if(typeof api.onAutoDownloadNotify==='function'){
    api.onAutoDownloadNotify(function(data){
      if(!data||!data.title)return;
      if('Notification' in window && Notification.permission==='granted'){new Notification(data.title,{body:data.body||'',icon:'icon.png'});}
      else if('Notification' in window && Notification.permission!=='denied'){Notification.requestPermission().then(function(p){if(p==='granted')new Notification(data.title,{body:data.body||'',icon:'icon.png'});});}
    });
  }

  // Legacy per-download toast (backward compatible)
  if(typeof api.onAutoDownloadToast==='function'){
    api.onAutoDownloadToast(function(data){
      if(data && data.message){
        toast(data.message,'i');
      } else if(data && data.series && data.episode){
        toast('Auto-downloaded '+epLabel()+' '+data.episode+' of '+data.series+': '+data.title,'s');
      }
    });
  }

  // Listen for auto-mark from player (configurable % watched)
  api.onAutoMark(async function(data){
    var name=data.seriesName,num=data.episodeNum;
    if(!name||num===null||num===undefined||isNaN(num)){console.warn('[AutoMark] Invalid automark data:',data);return;}
    toast('✓ Auto-marked '+epLabel()+' '+num+' as '+watchedLabel(),'s');
    var s=S.lib.find(function(x){return x.name===name});
    if(!s){console.warn('[AutoMark] Series not found in library:',name);return;}
    var allEpNums=s.episodes.filter(function(e){return e.episodeNum!==null}).map(function(e){return e.episodeNum}).sort(function(a,b){return a-b});
    await api.markUpTo(name,num,allEpNums);
    // Watch & Delete mode: delete the episode file after marking
    if(S.cfg.watchAndDelete){
      var ep=s.episodes.find(function(e){return e.episodeNum===num});
      if(ep){
        // Delay to ensure player has released the file
        setTimeout(async function(){
          var r=await api.deleteEpisodeFile(ep.path);
          if(r.success)toast('Deleted Ep '+num+' (watch & delete mode)','i');
        },5000);
      }
    }
    S.lib=await api.scanLibrary();
    await autoSyncSeries(name);
    if(S.cur&&S.cur.name===name)odtl(name);render();
  });
  // (torrent completion listener removed — external client mode, no in-process downloads)
  if(!S.cfg.setupDone){showSetupWizard();if(!S.cfg.folders||!S.cfg.folders.length){go('settings');}else{await loadLib();go('library');}}
  else if(isManga()?(!S.cfg.mangaFolders||!S.cfg.mangaFolders.length):(!S.cfg.folders||!S.cfg.folders.length)){go('settings');toast('Add your '+VM('anime','manga')+' folders to get started.','i');}
  else{await loadLib();go('library');if(S.mal&&S.cfg.autoSyncMal!==false)setTimeout(function(){autoSyncAll()},2000);}
}

async function loadLib(){
  S.loading=true;render();
  try{S.lib=await api.scanLibrary();
    for(var i=0;i<S.lib.length;i++){var s=S.lib[i];if(s.coverLocal||s.coverCached){var d=await api.getCoverDataUrl(s.coverLocal||s.coverCached);if(d)S.covers[s.name]=d;}}
    // Auto-fetch missing covers in background
    var missing=S.lib.filter(function(s){return !s.name.startsWith('__unsorted')&&!S.covers[s.name]});
    if(missing.length>0){
      api.anilistFetchAllCovers(missing.map(function(s){return {name:s.name}})).then(function(results){
        var withPath=results.filter(function(x){return x.path});
        if(!withPath.length)return;
        var fetched=0;
        withPath.forEach(function(r){
          api.getCoverDataUrl(r.path).then(function(d){
            if(d){S.covers[r.name]=d;}
            fetched++;
            if(fetched===withPath.length||fetched%5===0)render();
          });
        });
      });
    }
  }catch(e){if(notifEnabled('rescan'))toast('Scan failed','e',{label:'Retry',onClick:function(){loadLib()}});}
  S.loading=false;render();
}

async function autoSyncAll(){
  // Phase 1: Link unlinked series
  var unlinked=S.lib.filter(function(s){return !s.name.startsWith('__unsorted')&&!(s.watchData&&s.watchData.malId)}).map(function(s){return s.name});
  if(unlinked.length){
    if(notifEnabled('malSync'))toast('Auto-linking '+unlinked.length+' series with MAL...','i');
    var r=await api.malBulkAutoSync(unlinked);
    var ok=r.filter(function(x){return x.status==='linked'}).length;
    var reviewItems=r.filter(function(x){return x.status==='needs_review'});
    if(ok>0&&notifEnabled('malSync'))toast('Linked '+ok+' series to MAL','s');
    if(reviewItems.length>0){
      showSyncErrorPanel(reviewItems.map(function(x){return {name:x.name,reason:'MAL entry not found'}}));
    }
    S.lib=await api.scanLibrary();
  }
  // Phase 2: Refresh MAL data for ALL linked series so statuses/scores stay current
  var linked=S.lib.filter(function(s){return !s.name.startsWith('__unsorted')&&s.watchData&&s.watchData.malId});
  if(linked.length){
    if(notifEnabled('malSync'))toast('Refreshing MAL data for '+linked.length+' series...','i');
    var refreshed=0;
    for(var i=0;i<linked.length;i++){
      try{await fetchMDQuiet(linked[i].name,linked[i].watchData.malId);refreshed++;}catch(e){}
      if(i<linked.length-1)await new Promise(function(resolve){setTimeout(resolve,350)});
    }
    S.lib=await api.scanLibrary();
    if(refreshed>0&&notifEnabled('malSync'))toast('Refreshed '+refreshed+' series from MAL','s');
  }
  render();
}

function getCats(){
  var folderOrder=(S.cfg.folders||[]).map(function(f){return f.type}).filter(function(v,i,a){return a.indexOf(v)===i});
  var cats=new Set();S.lib.forEach(function(s){if(!s.name.startsWith('__unsorted'))cats.add(s.category)});
  var libCats=Array.from(cats);
  var ordered=[];
  folderOrder.forEach(function(fc){if(libCats.indexOf(fc)>=0&&ordered.indexOf(fc)<0)ordered.push(fc)});
  libCats.forEach(function(c){if(ordered.indexOf(c)<0)ordered.push(c)});
  return ordered;
}

function filt(list){var f=list.slice();if(S.q){var q=S.q.toLowerCase();f=f.filter(function(s){return s.name.toLowerCase().includes(q)})}
  if(S.filter==='watching')f=f.filter(function(s){var ml=getMyListStatus(s.watchData&&s.watchData.malData);if(ml)return ml.status==='watching'||ml.status==='reading';var w=s.watchData&&s.watchData.episodesWatched;return w&&w.length>0&&w.length<s.episodeCount});
  else if(S.filter==='completed')f=f.filter(function(s){var ml=getMyListStatus(s.watchData&&s.watchData.malData);if(ml)return ml.status==='completed';var w=s.watchData&&s.watchData.episodesWatched;return w&&s.episodeCount>0&&w.length>=s.episodeCount});
  else if(S.filter==='plan_to_watch')f=f.filter(function(s){var ml=getMyListStatus(s.watchData&&s.watchData.malData);if(ml)return ml.status==='plan_to_watch'||ml.status==='plan_to_read';return !s.watchData||!s.watchData.episodesWatched||!s.watchData.episodesWatched.length});
  else if(S.filter==='on_hold')f=f.filter(function(s){var ml=getMyListStatus(s.watchData&&s.watchData.malData);return ml&&ml.status==='on_hold'});
  else if(S.filter==='dropped')f=f.filter(function(s){var ml=getMyListStatus(s.watchData&&s.watchData.malData);return ml&&ml.status==='dropped'});

  if(sf.type&&sf.type!=='all')f=f.filter(function(s){var ml=s.watchData&&s.watchData.malData&&s.watchData.malData.media_type;return ml&&ml===sf.type});
  if(sf.minScore>0)f=f.filter(function(s){var ml=s.watchData&&s.watchData.malData&&s.watchData.malData.mean;return ml&&ml>=sf.minScore});
  if(sf.maxScore<10)f=f.filter(function(s){var ml=s.watchData&&s.watchData.malData&&s.watchData.malData.mean;return ml&&ml<=sf.maxScore});
  if(sf.genres&&sf.genres.length)f=f.filter(function(s){var g=(s.watchData&&s.watchData.malData&&s.watchData.malData.genres)||[];return sf.genres.some(function(gf){return g.some(function(gg){return(gg.name||'')===gf})})});

async function pEp(name,fpath,num){
  if(isManga()){
    // Manga mode: open with reader
    var r=await api.openMangaFile(fpath);
    if(r.error){toast(r.error,'e');return;}
    if(num!==null){
      // Show mark-as-read toast
      toast('Opened Ch '+num+'. Mark as read?','i');
      // Auto-mark chapter as read
      var s=S.lib.find(function(x){return x.name===name});
      var allNums=s?s.episodes.filter(function(e){return e.episodeNum!==null}).map(function(e){return e.episodeNum}).sort(function(a,b){return a-b}):[];
      await api.markUpTo(name,num,allNums);
      toast('Marked Ch '+num+' as read','s');S.lib=await api.scanLibrary();await autoSyncSeries(name);if(S.cur&&S.cur.name===name)odtl(name);
    }
    return;
  }
  var r=await api.play(fpath,name,num);if(r.error){toast(r.error,'e');return;}
  if(num!==null){
    if(S.cfg.autoMarkEnabled===false){
      // Auto-mark disabled: mark immediately on play (old behavior)
      var s=S.lib.find(function(x){return x.name===name});

async function autoSyncSeries(name, uncheckedEp){
  var s=S.lib.find(function(x){return x.name===name});if(!s)return;
  if(!S.mal)return;
  // Check if real-time sync is paused
  if(S.cfg.syncPaused){console.log('[Sync] Paused, skipping '+name);return;}
  var w=s.watchData;if(!w||!w.malId)return;
  var watched=w.episodesWatched||[];
  var highestEp=watched.length?Math.max.apply(null,watched):0;
  // If we just unchecked an episode and local list is empty or highest is below unchecked-1,
  // use uncheckedEp-1 as the true progress (episodes before our local files were already watched)
  if(uncheckedEp&&uncheckedEp>0){
    var trueProgress=uncheckedEp-1;
    if(trueProgress>highestEp)highestEp=trueProgress;
  }
  var totalEps=w.malData&&(w.malData.num_episodes||w.malData.num_chapters)?(w.malData.num_episodes||w.malData.num_chapters):0;
  // 3.2: Smart conflict detection. If MAL has MORE progress than local, don't
  // silently overwrite — ask the user. This protects progress made on another
  // device (mobile MAL app, web, another machine). Only triggers for real
  // regressions; identical values pass through silently.
  var mls=getMyListStatus(w.malData);
  var malHighest=mls?epWatchedField(mls):0;
  if(malHighest>highestEp&&malHighest>0){
    var resolution=await promptSyncConflict(name,highestEp,malHighest);
    if(resolution==='cancel')return;
    if(resolution==='mal'){
      // Adopt MAL's count locally — expand watched list to include 1..malHighest.
      var allEpNums=s.episodes.filter(function(e){return e.episodeNum!==null}).map(function(e){return e.episodeNum}).sort(function(a,b){return a-b});
      var newList=allEpNums.filter(function(n){return n<=malHighest});
      await api.setEpisodesWatched(name,newList);
      S.lib=await api.scanLibrary();
      toast('Adopted MAL progress: '+malHighest,'s');
      return;
    }
    if(resolution==='merge')highestEp=Math.max(highestEp,malHighest);
    // 'local' falls through and overwrites with local count, per user choice.
  }
  var st;
  if(highestEp>0&&totalEps>0&&highestEp>=totalEps)st='completed';
  else if(highestEp>0)st=isManga()?'reading':'watching';
  else st=isManga()?'plan_to_read':'plan_to_watch';
  console.log('[Sync] '+name+': highest '+watchedLabel()+' '+highestEp+' ('+st+') to MAL');
  var syncFields={status:st};
  if(isManga())syncFields.num_chapters_read=highestEp;
  else syncFields.num_watched_episodes=highestEp;
  var r=await api.malEditStatus(w.malId,syncFields,name);
  if(r&&!r.error){await fetchMD(name,w.malId);toast('Synced '+highestEp+' '+watchedLabel()+' to MAL','s');}
  else{console.error('[Sync] Failed:',r);toast('Sync error','e');}
}

function isTitleSimilar(a,b){
  a=a.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();
  b=b.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();
  if(a===b)return true;
  if(a.includes(b)||b.includes(a))return true;
  var aw=a.split(/\s+/),bw=new Set(b.split(/\s+/)),com=0;
  aw.forEach(function(w){if(bw.has(w))com++});
  return com/Math.max(aw.length,bw.size)>=0.5;
}

  if(!S.mal){toast('Connect MAL first','e',{label:'Connect',onClick:function(){go('mal')}});return;}
  var key=btoa(encodeURIComponent(name)).replace(/[=+/]/g,'_');

function closeMalRelink(){var el=document.getElementById('malRelinkOverlay');if(el)el.remove();}

async function malRelinkSearch(name){
  var inp=document.getElementById('mrlInput');var res=document.getElementById('mrlResults');
  if(!inp||!res)return;var q=inp.value.trim();if(!q)return;
  res.innerHTML='<div style="padding:12px;font-size:12px;color:var(--text-tertiary)">Searching...</div>';
  var d=await api.malSearch(q);
  if(d.error){res.innerHTML='<div style="color:var(--red);padding:12px;font-size:12px">'+d.error+'</div>';return;}
  var items=d.data||[];if(!items.length){res.innerHTML='<div style="padding:12px;font-size:12px;color:var(--text-tertiary)">No results</div>';return;}
  res.innerHTML=items.map(function(x){var n=x.node;var img=n.main_picture?n.main_picture.medium:'';
    return '<div class="mri" onclick="malRelinkPick(\''+J(name)+'\','+n.id+',\''+J(n.title)+'\')">'
    +(img?'<img src="'+img+'">':'')
    +'<div class="mri-i"><div class="mri-t">'+E(n.title)+'</div><div class="mri-m">'+(n.num_episodes||n.num_chapters||'?')+' '+epLabel().toLowerCase()+' · '+(n.media_type||'')+' · ★ '+(n.mean||'N/A')+' · ID: '+n.id+'</div></div></div>';}).join('');
}

async function malManualIdSubmit(seriesName){
  var inp=document.getElementById('malManualInput');
  if(!inp)return;
  var idStr=inp.value.trim();
  if(!idStr||!/\d+/.test(idStr)){toast('Enter a valid numeric MAL ID','e');return;}
  var malId=parseInt(idStr);
  if(isNaN(malId)||malId<=0){toast('Enter a valid numeric MAL ID','e');return;}
  var preview=document.getElementById('malManualPreview');
  if(preview)preview.innerHTML='<div style="padding:12px;font-size:12px;color:var(--text-tertiary)">Fetching MAL entry...</div>';
  try{
    var details=await api.malGetAnimeDetails(malId);
    if(!details){toast('MAL entry not found for ID '+malId,'e');if(preview)preview.innerHTML='<div style="padding:12px;font-size:12px;color:var(--red)">Entry not found</div>';return;}
    // Show preview and confirm
    var img=details.main_picture?details.main_picture.medium:'';
    var title=details.title||'Unknown';
    var type=details.media_type||'?';
    var score=details.mean||'N/A';
    var episodes=details.num_episodes||details.num_chapters||'?';
    var html='<div style="display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--bg-raised);border-radius:var(--radius-md);border:1px solid var(--border)">';
    if(img)html+='<img src="'+img+'" style="width:60px;height:90px;object-fit:cover;border-radius:var(--radius-sm);flex-shrink:0">';
    html+='<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;margin-bottom:4px">'+E(title)+'</div>';
    html+='<div style="font-size:11px;color:var(--text-secondary)">'+E(type)+' · ★ '+score+' · '+episodes+' '+epLabel().toLowerCase()+' · ID: '+malId+'</div>';
    html+='<div style="display:flex;gap:8px;margin-top:10px">';
    html+='<button class="btn btn-s btn-sm" onclick="malManualIdConfirm(\''+J(seriesName)+'\','+malId+',\''+J(title)+'\')">Confirm Link</button>';
    html+='<button class="btn btn-g btn-sm" onclick="closeMalManualId()">Cancel</button></div></div></div>';
    if(preview)preview.innerHTML=html;
  }catch(e){
    toast('Error fetching MAL entry: '+(e.message||e),'e');
    if(preview)preview.innerHTML='<div style="padding:12px;font-size:12px;color:var(--red)">Error: '+E(e.message||'Unknown error')+'</div>';
  }
}

async function startMal(){var cid=document.getElementById('malCid');var csec=document.getElementById('malCsec');
  if(!cid||!cid.value.trim()){toast('Enter Client ID','e');return;}
  var url=await api.malGetAuthUrl(cid.value.trim(),csec?csec.value.trim():'');api.openExternal(url);toast('Complete login in browser...','i');
  var code=await api.malStartAuthServer();if(!code){toast('Timed out','e');return;}
  try{await api.malExchangeToken(code);S.mal=true;S.cfg=await api.getConfig();uMal();toast('Connected!','s');render();setTimeout(function(){autoSyncAll()},1000);}
  catch(e){toast('Failed: '+(e.message||e),'e');}}

function setAnimSpeed(speed){
  S.cfg.animSpeed=speed;api.setConfig('animSpeed',speed);
  var root=document.documentElement;
  if(speed==='none'){
    root.style.setProperty('--transition','0ms');
    root.style.setProperty('--transition-slow','0ms');
    root.style.setProperty('--anim-card','0ms');
    root.style.setProperty('--anim-scale','1');
  }else if(speed==='slow'){
    root.style.setProperty('--transition','500ms cubic-bezier(.4,0,.2,1)');
    root.style.setProperty('--transition-slow','900ms cubic-bezier(.16,1,.3,1)');
    root.style.setProperty('--anim-card','800ms');
    root.style.setProperty('--anim-scale','1');
  }else if(speed==='fast'){
    root.style.setProperty('--transition','80ms cubic-bezier(.4,0,.2,1)');
    root.style.setProperty('--transition-slow','150ms cubic-bezier(.4,0,.2,1)');
    root.style.setProperty('--anim-card','200ms');
    root.style.setProperty('--anim-scale','1');
  }else{

// 4.3: auto-detect installed readers. Single hit → pre-fill; multiple → picker.
async function detectReader(){
  var hint=document.getElementById('readerDetectHint');
  if(hint)hint.innerHTML='Scanning common install paths...';
  var hits=await api.detectMangaReaders();
  if(!hits||!hits.length){if(hint)hint.innerHTML='No supported readers found in Program Files or %LOCALAPPDATA%. You can still set the path manually.';toast('No readers detected','i');return;}
  if(hits.length===1){
    var inp=document.getElementById('sReaderPath');if(inp)inp.value=hits[0].path;
    S.cfg.readerPath=hits[0].path;api.setConfig('readerPath',hits[0].path);
    if(hint)hint.innerHTML='Detected: <strong>'+E(hits[0].name)+'</strong> at '+E(hits[0].path);
    toast('Found '+hits[0].name,'s');return;
  }
  // Multiple hits — picker modal
  var h='<div class="mal-edit-overlay" onclick="if(event.target===this)_closeReaderPick()"><div class="mal-edit-panel" style="width:440px">';
  h+='<h3>Multiple readers found</h3><p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">Pick which one to use for .cbz/.cbr files:</p>';
  hits.forEach(function(x,i){
    h+='<div class="mri" data-reader-idx="'+i+'" style="cursor:pointer;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px"><div class="mri-i"><div class="mri-t">'+E(x.name)+'</div><div class="mri-m" style="font-size:10px">'+E(x.path)+'</div></div></div>';
  });
  h+='<div class="mal-edit-actions"><button class="btn btn-s btn-sm" onclick="_closeReaderPick()">Cancel</button></div></div></div>';
  var div=document.createElement('div');div.id='readerPickOverlay';div.innerHTML=h;document.body.appendChild(div);
  div.addEventListener('click',function(e){
    var row=e.target.closest('[data-reader-idx]');if(!row)return;
    var idx=parseInt(row.getAttribute('data-reader-idx'),10);var pick=hits[idx];if(!pick)return;
    var inp=document.getElementById('sReaderPath');if(inp)inp.value=pick.path;
    S.cfg.readerPath=pick.path;api.setConfig('readerPath',pick.path);
    if(hint)hint.innerHTML='Detected: <strong>'+E(pick.name)+'</strong> at '+E(pick.path);
    toast('Set reader: '+pick.name,'s');_closeReaderPick();
  });

function _closeReaderPick(){var el=document.getElementById('readerPickOverlay');if(el)el.remove();}
// 3.4: Hash of the folder config that the watcher depends on. When it changes
// between saveSets calls, the watcher is auto-restarted so it picks up the new
// destination roots without requiring a manual Stop/Start.
function _watcherConfigHash(cfg){
  try {
    return JSON.stringify({
      folders:(cfg.folders||[]).map(function(f){return f&&f.path}),
      mangaFolders:(cfg.mangaFolders||[]).map(function(f){return f&&f.path}),
      watcherFolder:cfg.watcherFolder||''
    });
  } catch(e) { return ''; }
}
var _lastWatcherHash=null;
async function saveSets(){
  var vlc=document.getElementById('sVlc');if(vlc)S.cfg.vlcPath=vlc.value;
  var mpv=document.getElementById('sMpv');if(mpv)S.cfg.mpvPath=mpv.value;
  var pt=document.getElementById('sPlayerType');if(pt)S.cfg.playerType=pt.value;
  var am=document.getElementById('sAutoMark');if(am)S.cfg.autoMarkEnabled=am.checked;
  var amp=document.getElementById('sAutoMarkPct');if(amp){var pv=parseInt(amp.value);if(pv>=10&&pv<=100)S.cfg.autoMarkPercent=pv;}
  var sp=document.getElementById('sSubPrimary');if(sp)S.cfg.subLangPrimary=sp.value;
  var sf=document.getElementById('sSubFallback');if(sf)S.cfg.subLangFallback=sf.value;
  var rp=document.getElementById('sReaderPath');if(rp)S.cfg.readerPath=rp.value;
  // Compute pre/post watcher-config hashes. If they differ AND the watcher is
  // active, restart it transparently so the watcher's destination-matching
  // sees the new library roots.
  if(_lastWatcherHash===null)_lastWatcherHash=_watcherConfigHash(S.cfg);
  await api.setAllConfig(S.cfg);S.cfg=await api.getConfig();
  var newHash=_watcherConfigHash(S.cfg);
  if(newHash!==_lastWatcherHash){
    _lastWatcherHash=newHash;
    var ws=await api.watcherStatus();
    if(ws&&ws.enabled&&ws.folder){
      await api.watcherStop();
      await api.watcherStart(ws.folder,ws.dest||ws.folder);
      S.watcherStatus=await api.watcherStatus();
      toast('Watcher restarted with updated folders','i');
    }
  }
  toast('Saved','s');}

  // connect attempt to fail with a confusing error.
  await api.setAllConfig({

  toast('All preferences reset. Restarting setup...','s');
  showSetupWizard();go('settings');
}

async function placeNewSeries(idx,destFolder){
  if(!S.pendingNewSeries||!S.pendingNewSeries[idx])return;
  var item=S.pendingNewSeries[idx];
  // Build the backend payload from the grouped item:
  // originalPath and isFolder are stored on the first file entry
  var firstFile=item.files&&item.files[0]?item.files[0]:{};
  var payload={
    series:item.series,
    newName:firstFile.newName||item.series,
    originalPath:firstFile.originalPath||'',
    isFolder:!!firstFile.isFolder,
    isNewSeries:true
  };
  toast('Moving "'+item.series+'" to selected folder...','i');
  var r=await api.watcherPlaceNewSeries(payload,destFolder);
  if(r.error){toast('Failed: '+r.error,'e');return;}
  S.pendingNewSeries.splice(idx,1);
  var logName=firstFile.file||firstFile.name||item.series;
  S.watcherLog.unshift({file:logName,newName:firstFile.newName||item.series,series:item.series});
  if(S.watcherLog.length>20)S.watcherLog=S.watcherLog.slice(0,20);
  toast('Moved: '+item.series,'s');
  await loadLib();
  if(S.view==='filemgmt')render();
}

// Returns true when the event target is an input/textarea/select/contenteditable,

function _isTypingTarget(e){
  var t=e.target;if(!t)return false;
  var tag=(t.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return true;
  if(t.isContentEditable)return true;
  return false;
}
// Focus the primary search input of the currently active view, if any.
function _focusActiveSearch(){
  var sel;
  if(S.view==='library')sel='.sbc .exs-input';
  else if(S.view==='continue'||S.view==='completed')sel='.sr,.sbc';
  else if(S.view==='mylist')sel='.exs-input';
  else if(S.view==='settings')sel='.exs-input';
  else if(S.view==='explore')sel='#exsInput';
  // Prefer the first visible exs-input in the main content area
  var mc=document.getElementById('mc');if(!mc)return false;
  var inp=mc.querySelector('.exs-input');
  if(inp){inp.focus();inp.select&&inp.select();return true;}
  return false;
}
// In the detail overlay: Enter plays next unwatched; ↑/↓ scroll the episode list.
function _dovKeyHandler(e){
  var dov=document.getElementById('dov');
  if(!dov||!dov.classList.contains('open'))return false;
  if(e.key==='Enter'){
    if(S.cur&&S.cur.name){pNxt(S.cur.name);e.preventDefault();return true;}
  }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    var pn=document.getElementById('dpn');if(pn){pn.scrollBy({top:e.key==='ArrowDown'?80:-80,behavior:'smooth'});e.preventDefault();return true;}
  }
  return false;
}
document.addEventListener('keydown',function(e){
  // Escape closes the detail overlay (or any open palette) — always active,
  // even inside inputs, so the user can always bail out.
  if(e.key==='Escape'){
    if(typeof _closePalette==='function'&&_closePalette())return;
    cdtl();
    return;
  }
  // Alt+Left/Right — view history nav. Safe even while typing.
  if(e.altKey&&e.key==='ArrowLeft'){navBack();e.preventDefault();return;}
  if(e.altKey&&e.key==='ArrowRight'){navForward();e.preventDefault();return;}

  // Ctrl/Cmd+K — command palette (works even while typing in search boxes,
  // because the palette is itself a search UI).
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==='k'||e.key==='K')){
    if(typeof openPalette==='function'){openPalette();e.preventDefault();return;}
  }

  // Ctrl/Cmd+F — focus active search (override browser find; our search is more useful here).
  // Skip when palette is open — user is already in a search box.
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==='f'||e.key==='F')){
    if(_palState.open){e.preventDefault();return;}
    if(_focusActiveSearch()){e.preventDefault();return;}
  }

  // Ctrl+comma → Settings. Ctrl+E → Explore. Ctrl+L → My List.
  // Ctrl+Shift+M → toggle vault mode. These all work even while typing because
  // the combo isn't something the user would produce in normal text entry.
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key===','){go('settings');e.preventDefault();return;}
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==='e'||e.key==='E')){go('explore');e.preventDefault();return;}
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==='l'||e.key==='L')){go('mylist');e.preventDefault();return;}
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&!e.altKey&&(e.key==='m'||e.key==='M')){
    switchMode(isManga()?'anime':'manga');e.preventDefault();return;
  }
  // Shift+? — show keyboard shortcuts help (the "?" key is typically Shift+/).
  // Works even while typing because the combo isn't produced during normal text.
  if(e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key==='?'){
    if(typeof showKeyboardHelp==='function'){showKeyboardHelp();e.preventDefault();return;}
  }

  // The remaining shortcuts are plain keypresses — suppress them when the user
  // is typing into an input so we don't hijack the keystroke.
  if(_isTypingTarget(e))return;

  // Detail overlay nav (Enter plays next; ↑/↓ scroll episode list).
  if(_dovKeyHandler(e))return;

  // "/" — focus active search. Matches Slack/GitHub muscle memory.
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(_focusActiveSearch()){e.preventDefault();return;}
  }
  // 1–6 — jump to sidebar tabs. Matches sidebar order in the UI.
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.shiftKey){
    var tabMap={'1':'library','2':'explore','3':'mylist','4':'continue','5':'completed','6':'filemgmt','7':'schedule','8':'stats'};
    if(tabMap[e.key]){go(tabMap[e.key]);e.preventDefault();return;}
  }
});

var _navHistory=['library'];var _navIdx=0;
function navPush(v){if(_navHistory[_navIdx]===v)return;_navHistory=_navHistory.slice(0,_navIdx+1);_navHistory.push(v);_navIdx=_navHistory.length-1;}
function navBack(){if(_navIdx>0){_navIdx--;var v=_navHistory[_navIdx];_goNoHistory(v);}}
function navForward(){if(_navIdx<_navHistory.length-1){_navIdx++;var v=_navHistory[_navIdx];_goNoHistory(v);}}

// ========== NYAA SEARCH ==========
function buildNyaaUrl(seriesTitle,epNum){
  var cat=isManga()?'3_1':'1_2';
  var uploader=S.cfg.nyaaUploader||'erai';
  var quality=S.cfg.nyaaQuality||'1080p';
  var q='';
  if(isManga()){
    q=seriesTitle;
  } else {
    if(uploader==='erai')q='[Erai-raws] '+seriesTitle+' '+quality;
    else if(uploader==='subsplease')q='[SubsPlease] '+seriesTitle+' ('+quality+')';
    else if(uploader==='judas')q='[Judas] '+seriesTitle+' '+quality;
    else if(uploader==='varyg')q=seriesTitle+' '+quality+' VARYG';
  }
  if(epNum)q+=' '+String(epNum).padStart(2,'0');
  return 'https://nyaa.si/?f=0&c='+cat+'&q='+encodeURIComponent(q);
}

function buildNyaaUrlRange(seriesTitle,fromEp,toEp){
  var cat=isManga()?'3_1':'1_2';
  var uploader=S.cfg.nyaaUploader||'erai';
  var quality=S.cfg.nyaaQuality||'1080p';
  var q='';
  if(isManga()){
    q=seriesTitle;
  } else {
    if(uploader==='erai')q='[Erai-raws] '+seriesTitle+' '+quality;
    else if(uploader==='subsplease')q='[SubsPlease] '+seriesTitle+' ('+quality+')';
    else if(uploader==='judas')q='[Judas] '+seriesTitle+' '+quality;
    else if(uploader==='varyg')q=seriesTitle+' '+quality+' VARYG';
  }
  return 'https://nyaa.si/?f=0&c='+cat+'&q='+encodeURIComponent(q)+'&s=id&o=desc';
}

function lookupMissing(seriesTitle,watched,total,localEps){
  var nextEp=(watched||0)+1;
  if(total&&nextEp>total){toast('All episodes watched!','i');return;}
  var url=buildNyaaUrlRange(seriesTitle,nextEp,total||999);

}

var _dlDropOpen=null;
var _dlPortal=null;

function dlSplitBtn(title,malData){
  var t=J(title);
  var mls=getMyListStatus(malData);
  // Support both MAL anime object shape (.status) and watchData.malData shape (.my_list_status)
  var status=(malData&&(malData.status||(mls&&mls.status)||'')).toString();
  var isAiring=status==='currently_airing'||status==='airing';
  var total=malData?totalField(malData):0;
  var startDate=malData?(malData.start_date||''):'';
  // Latest aired ep: for airing use estimateAired, for finished use total, fallback to watched+1
  var latestAired=isAiring?estimateAired(startDate,total):(total||null);
  var watched=mls?epWatchedField(mls):(malData&&(malData.num_episodes_watched||malData.num_chapters_read)||0);
  // Target = latest aired (what's actually out), not watched+1
  var targetEp=latestAired||watched+1;
  var id='dlds-'+Math.random().toString(36).slice(2,7);
  var epDesc=isAiring?(epLabel()+' '+targetEp+' · latest '+VM('aired','released')+' · uploader match'):VM('Best-seeded eng sub release','Best-seeded release');
  return '<div class="dl-split" id="'+id+'">'
    +'<button class="dl-split-main" onclick="autoDownloadLatest(\''+t+'\','+isAiring+','+targetEp+')">'
    +'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16l-6-6h4V4h4v6h4l-6 6zm-8 4h16v-2H4v2z"/></svg>'
    +'Download</button>'
    +'<button class="dl-split-arrow" onclick="toggleDlDrop(event,\''+id+'\',\''+t+'\','+isAiring+','+targetEp+')" aria-label="More download options">'
    +'<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>'
    +'</button>'
    +'</div>';
}

function toggleDlDrop(e,id,title,isAiring,targetEp){
  e.stopPropagation();
  var btn=document.getElementById(id);
  var portal=_getDlPortal();
  var dd=document.getElementById('dl-dropdown');

  // If same button already open — close
  if(_dlDropOpen===id){
    dd.classList.remove('open');
    portal.classList.remove('open');
    if(btn)btn.classList.remove('open');
    _dlDropOpen=null;
    return;
  }

  // Close any previously open one
  if(_dlDropOpen){
    var prev=document.getElementById(_dlDropOpen);
    if(prev)prev.classList.remove('open');
  }

  var t=title;
  var epDesc=isAiring?('Ep '+targetEp+' · latest aired'):'Best-seeded eng sub';
  // FIX #3: Context-aware dropdown options
  // - Completed series: hide "Download Latest Episode" (no new episodes)
  // - Airing series: show "Download Latest Episode", hide "Batch / Season Pack"
  // - "Batch / Season Pack" removed entirely (redundant with "Entire Series")
  var items='';
  if(isAiring){
    items+='<div class="dl-dd-item" onclick="closeDlDrop();autoDownloadLatest(\''+J(t)+'\','+isAiring+','+targetEp+')">'
      +'<div class="dl-dd-icon">⬇</div><div><div class="dl-dd-label">Latest Episode</div>'
      +'<div class="dl-dd-desc">'+epDesc+'</div></div></div>';
  }
  items+='<div class="dl-dd-item" onclick="closeDlDrop();autoDownloadFull(\''+J(t)+'\','+isAiring+')">'
    +'<div class="dl-dd-icon">📦</div><div><div class="dl-dd-label">Entire Series</div>'
    +'<div class="dl-dd-desc">Best-seeded release · eng sub</div></div></div>'
    +'<div class="dl-dd-item" onclick="closeDlDrop();api.openExternal(buildNyaaUrl(\''+J(t)+'\'))">'
    +'<div class="dl-dd-icon">🔍</div><div><div class="dl-dd-label">Browse on Nyaa.si</div>'
    +'<div class="dl-dd-desc">Open Nyaa search in browser</div></div></div>';
  dd.innerHTML=items;

  // Position portal below the arrow button
  var arrowBtn=btn?btn.querySelector('.dl-split-arrow'):null;
  var ref=arrowBtn||btn;
  if(ref){
    var rect=ref.getBoundingClientRect();
    var ddW=240;
    var left=rect.left;
    // Clamp to viewport
    if(left+ddW>window.innerWidth-8) left=window.innerWidth-ddW-8;
    if(left<8) left=8;
    var top=rect.bottom+6;
    // If too close to bottom, open upward
    if(top+280>window.innerHeight) top=rect.top-280-6;
    portal.style.left=left+'px';
    portal.style.top=top+'px';
  }

  _dlDropOpen=id;
  if(btn)btn.classList.add('open');
  portal.classList.add('open');
  // Small delay so transition is visible
  requestAnimationFrame(function(){ dd.classList.add('open'); });
}

function closeDlDrop(){
  var dd=document.getElementById('dl-dropdown');
  var portal=_getDlPortal();
  if(dd)dd.classList.remove('open');
  portal.classList.remove('open');
  if(_dlDropOpen){var prev=document.getElementById(_dlDropOpen);if(prev)prev.classList.remove('open');}
  _dlDropOpen=null;
}

document.addEventListener('click',function(e){
  if(_dlDropOpen&&!e.target.closest('.dl-split')&&!e.target.closest('#dl-portal')){
    closeDlDrop();
  }
});
// Close on modal scroll so it doesn't float away
document.addEventListener('scroll',function(){if(_dlDropOpen)closeDlDrop();},true);

function getCurrentSeason(){var m=new Date().getMonth();if(m<3)return{season:'winter',year:new Date().getFullYear()};if(m<6)return{season:'spring',year:new Date().getFullYear()};if(m<9)return{season:'summer',year:new Date().getFullYear()};return{season:'fall',year:new Date().getFullYear()};}

// Donghua detection — known Chinese animation studios on MAL
var _cnStudios=['bilibili','haoliners','emon','colored-pencil','b.cmay','shanghai','tencent','iqiyi','youku','cg year','creative power','sparkly key','nice boat','shenying','china film','enlight','foch','pb animation','alpha group','xing yi kai chen','wolf smoke','big firebird','l2 studio','calf studio','high energy studio','studio liu','garden culture','dc impression vision','ruo hong culture','original force','nanjing'];
function _isDonghua(a){
  if(!a)return false;
  var studios=a.studios||[];
  for(var i=0;i<studios.length;i++){
    var sn=(studios[i].name||'').toLowerCase();
    for(var j=0;j<_cnStudios.length;j++){if(sn.indexOf(_cnStudios[j])>=0)return true;}
  }
  var title=a.title||'';
  var cjkCount=0;for(var k=0;k<title.length;k++){var code=title.charCodeAt(k);if(code>=0x4E00&&code<=0x9FFF)cjkCount++;}
  if(title.length>0&&cjkCount/title.length>0.5)return true;
  return false;
}
function _filterDonghua(items){
  if(S.cfg.hideDonghua===false)return items;
  return items.filter(function(a){return !_isDonghua(a)});
}

function exfClearAll(){S.exFilter={genres:[],types:[],minScore:0,status:''};S._exfOpen=null;exfClosePanel();renderExplore();}
var EXF_GENRES=['Action','Adventure','Comedy','Drama','Fantasy','Horror','Mystery','Romance','Sci-Fi','Slice of Life','Sports','Supernatural','Thriller','Ecchi','Mecha','Music','Psychological','Historical','Isekai','Martial Arts','Military','School','Shounen','Shoujo','Seinen','Josei','Harem','Magic'];

var EXF_STATUSES_ANIME=[{v:'currently_airing',l:'Airing'},{v:'finished_airing',l:'Finished'},{v:'not_yet_aired',l:'Upcoming'}];

function showExsDropdown(){
  if(exsResults.length){var dd=document.getElementById('exsDropdown');if(dd)dd.classList.add('open');}
}

function hideExsDropdown(){
  var dd=document.getElementById('exsDropdown');if(dd)dd.classList.remove('open');
}

function clearExsSearch(){
  var inp=document.getElementById('exsInput');if(inp){inp.value='';inp.focus();}
  var clear=document.getElementById('exsClear');if(clear)clear.classList.remove('show');
  var bar=document.getElementById('exsBar');if(bar)bar.classList.remove('loading');
  exsResults=[];exsSelIdx=-1;

function exsKeydown(ev){
  if(ev.key==='Escape'){clearExsSearch();return;}
  if(ev.key==='ArrowDown'){ev.preventDefault();exsSelIdx=Math.min(exsSelIdx+1,exsResults.length-1);highlightExsItem();return;}
  if(ev.key==='ArrowUp'){ev.preventDefault();exsSelIdx=Math.max(exsSelIdx-1,0);highlightExsItem();return;}
  if(ev.key==='Enter'&&exsSelIdx>=0&&exsResults[exsSelIdx]){ev.preventDefault();exsPickResult(exsResults[exsSelIdx].id);return;}
}

  var dd=document.getElementById('exsDropdown');if(!dd)return;

  if(items[exsSelIdx])items[exsSelIdx].scrollIntoView({block:'nearest'});

// Estimate how many episodes have aired for a currently airing series
function estimateAired(startDate,total){
  if(!startDate)return total||0;
  var start=new Date(startDate);var now=new Date();
  var weeks=Math.floor((now-start)/(7*24*3600000))+1;
  if(total&&weeks>total)return total;
  return Math.max(1,weeks);
}

// Broadcast day helper: adjusted for Mexico time (UTC-6)
// If pending hours > 6 → "Tomorrow"; if aired within last 12h → "Today"
function calcNextBroadcast(dayName){
  var days=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
  var bcastIdx=days.indexOf(dayName);if(bcastIdx<0)return'';
  // Use Mexico time (UTC-6) since user is in Mexico City
  var now=new Date();
  var utcMs=now.getTime()+now.getTimezoneOffset()*60000;
  var mx=new Date(utcMs-6*3600000);
  var mxDay=(mx.getDay()+6)%7; // 0=Mon
  var mxHour=mx.getHours();
  var diff=bcastIdx-mxDay;
  if(diff<0)diff+=7;
  if(diff===0){
    // Broadcast day is today in MX time
    // Most anime airs morning MX time (evening JST), so if it's past noon it likely already aired
    if(mxHour>=12)return 'Today'; // Already aired today
    return 'Today'; // Will air later today
  }
  if(diff===1){
    // Tomorrow — but if current time is late night (after midnight), the "tomorrow" episode
    // is actually less than 24h away. Show "Tomorrow".
    return 'Tomorrow';
  }
  return diff+'d';
}

S._setupStep=0;

function showSetupWizard(){
  S._setupStep=0;
  renderSetupStep();
}

function renderSetupStep(){
  var step=SETUP_STEPS[S._setupStep];
  var total=SETUP_STEPS.length;
  var isFirst=S._setupStep===0;
  var isLast=S._setupStep===total-1;
  var h='<div class="setup-overlay">'
    +'<div class="setup-panel">'
    +'<div class="setup-header"><h2>'+step.title+'</h2></div>'
    +'<div class="setup-body">'+step.body()+'</div>'
    +'<div class="setup-footer">';
  if(isFirst)h+='<button class="btn btn-g btn-sm" onclick="closeSetup()">Skip Setup</button>';
  else h+='<button class="btn btn-s btn-sm" onclick="setupPrev()">Back</button>';
  // Dots
  h+='<div class="setup-dots">';
  for(var i=0;i<total;i++)h+='<div class="setup-dot'+(i===S._setupStep?' active':'')+'"></div>';
  h+='</div>';
  if(isLast)h+='<button class="btn btn-p btn-sm" onclick="closeSetup()">Get Started</button>';
  else h+='<button class="btn btn-p btn-sm" onclick="setupNext()">Next</button>';
  h+='</div></div></div>';
  document.getElementById('setupWizard').innerHTML=h;
}

function setupNext(){if(S._setupStep<SETUP_STEPS.length-1){S._setupStep++;renderSetupStep();}}
function setupPrev(){if(S._setupStep>0){S._setupStep--;renderSetupStep();}}

function closeSetup(){
  document.getElementById('setupWizard').innerHTML='';
  S.cfg.setupDone=true;api.setConfig('setupDone',true);
}

async function setupAddFolder(){
  var type=document.getElementById('setupFolderType').value;
  var f=await api.browseFolder();
  if(!f)return;
  if(!S.cfg.folders)S.cfg.folders=[];
  S.cfg.folders.push({path:f,label:type.charAt(0).toUpperCase()+type.slice(1),type:type});
  await api.setAllConfig(S.cfg);
  renderSetupStep();
}

async function setupConnectMal(){
  var cid=document.getElementById('setupMalCid');
  if(!cid||!cid.value.trim()){toast('Enter Client ID','e');return;}
  var url=await api.malGetAuthUrl(cid.value.trim(),'');
  api.openExternal(url);toast('Complete login in browser...','i');
  var code=await api.malStartAuthServer();
  if(!code){toast('Timed out','e');return;}
  try{
    await api.malExchangeToken(code);
    S.mal=true;S.cfg=await api.getConfig();uMal();toast('Connected!','s');
    renderSetupStep();
  }catch(e){toast('Failed: '+e.message,'e');}
}

// Card sync warning badge — event delegation
document.addEventListener('click',function(e){
  // Auto-download track button in detail overlay
  var adBtn=e.target.closest('[data-ad-track]');
  if(adBtn){
    e.stopPropagation();
    var name=adBtn.getAttribute('data-ad-track');
    var malId=parseInt(adBtn.getAttribute('data-ad-malid'))||null;
    toggleAutoDownloadTrack(name,malId);
    return;
  }
  // Auto-download poll now button
  var adPoll=e.target.closest('[data-ad-poll]');
  if(adPoll){
    api.autoDownloadPollNow().then(function(res){
      if(res && res.results && res.results.disabled){
        toast('Auto-download is disabled. Enable it in Settings first.','i',{label:'Open',onClick:function(){go('settings')}});
        return;
      }
      if(res && res.results && res.results.polled){
        var r=res.results;
        var msgs=[];
        if(r.downloaded && r.downloaded.length) msgs.push(r.downloaded.length+' downloaded');
        if(r.skipped_local && r.skipped_local.length) msgs.push(r.skipped_local.length+' skipped (have local)');
        if(r.dedup && r.dedup.length) msgs.push(r.dedup.length+' deduped');
        if(r.no_results && r.no_results.length) msgs.push(r.no_results.length+' no results');
        if(r.no_exact_match && r.no_exact_match.length) msgs.push(r.no_exact_match.length+' no exact match');
        if(r.error && r.error.length) msgs.push(r.error.length+' errors');
        if(msgs.length) toast('Poll complete: '+msgs.join(', '),'s');
        else toast('Poll complete — nothing to download','i');
      } else {
        toast('Poll complete — watchlist empty','i');
      }
    });
    toast('Polling now...','i');
    return;
  }
  // Auto-download force poll button
  var adForce=e.target.closest('[data-ad-force-poll]');
  if(adForce){
    api.autoDownloadPollNow(true).then(function(res){
      if(res && res.results && res.results.polled){
        var r=res.results;
        var msgs=[];
        if(r.downloaded && r.downloaded.length) msgs.push(r.downloaded.length+' downloaded');
        if(r.skipped_local && r.skipped_local.length) msgs.push(r.skipped_local.length+' skipped (have local)');
        if(r.dedup && r.dedup.length) msgs.push(r.dedup.length+' deduped');
        if(r.no_results && r.no_results.length) msgs.push(r.no_results.length+' no results');
        if(r.no_exact_match && r.no_exact_match.length) msgs.push(r.no_exact_match.length+' no exact match');
        if(r.error && r.error.length) msgs.push(r.error.length+' errors');
        if(msgs.length) toast('Force poll complete: '+msgs.join(', '),'s');
        else toast('Force poll complete — nothing to download','i');
      } else {
        toast('Force poll complete — watchlist empty','i');
      }
    });
    toast('Force polling (ignoring dedup)...','i');
    return;
  }
  // Auto-download remove button
  var adRem=e.target.closest('[data-ad-remove]');
  if(adRem){
    var name=adRem.getAttribute('data-ad-remove');
    if(name)removeAutoDownloadTrack(name);
    return;
  }
  var warn=e.target.closest('.card-warn');
  if(warn){
    e.preventDefault();
    e.stopPropagation();
    var name=warn.getAttribute('data-warn-name');
    if(name)malRelink(name);
    return;
  }
  // Play button on cards
  var playBtn=e.target.closest('[data-play]');
  if(playBtn){
    e.stopPropagation();
    var name=playBtn.getAttribute('data-play');
    if(name)pNxt(name);
    return;
  }
  // Card click → open detail (data-series on .card or .scrc)
  var card=e.target.closest('.card[data-series],.scrc[data-series]');
  if(card&&!e.target.closest('.card-warn')&&!e.target.closest('[data-play]')&&!e.target.closest('.ctx-menu')){
    var name=card.getAttribute('data-series');
    if(name)odtl(name);
    return;
  }
});

// ========== COMMAND PALETTE (2.1) ==========
// Lightweight custom fuzzy matcher — no CDN needed. Scores a candidate string
// against a query by checking whether the query chars appear in order, with
// bonuses for consecutive matches, prefix matches, and matches at word starts.
// Returns -Infinity when query doesn't match at all; otherwise a sortable score.
function _palFuzzy(query,candidate){
  if(!query)return 0;
  var q=query.toLowerCase(),c=(candidate||'').toLowerCase();
  if(!c)return -Infinity;
  if(c===q)return 1000;
  if(c.indexOf(q)===0)return 800;                    // prefix match
  if(c.indexOf(q)>=0)return 500-c.indexOf(q);        // substring
  // Fall through to char-by-char subsequence scoring
  var qi=0,score=0,prevMatchIdx=-2;
  for(var ci=0;ci<c.length&&qi<q.length;ci++){
    var ch=c.charAt(ci);
    var isBoundary=ci===0||' _-.[](){}'.indexOf(c.charAt(ci-1))>=0;
    if(ch===q.charAt(qi)){
      score+=1;
      if(ci===prevMatchIdx+1)score+=3;               // consecutive
      if(isBoundary)score+=4;                         // word-start
      prevMatchIdx=ci;
      qi++;
    }
  }
  if(qi<q.length)return -Infinity;                   // query didn't fully match
  // Penalize long strings so shorter candidates rank higher when scores tie.
  return score-Math.min(c.length/40,4);
}
var _palState={open:false,sel:0,items:[],query:'',filtered:[]};

  var items=[];
  // Views — the things the sidebar already exposes.

    {kind:'Action',title:'Library Health Check',sub:'Missing eps, duplicates, orphans',icon:'🩺',run:function(){S.fmTab='tools';go('filemgmt');setTimeout(runHealthCheck,50);}},
    {kind:'Action',title:'Keyboard shortcuts',sub:'Show all shortcuts and chords',icon:'⌨',run:function(){showKeyboardHelp()}}
  ];
  actions.forEach(function(a){items.push(a)});
  // Library series — each local series becomes a jump target.
  var lib=(S.lib||[]).filter(function(s){return !s.name.startsWith('__unsorted')});
  lib.forEach(function(s){
    items.push({kind:'Library',title:s.name,sub:s.episodeCount+' '+epLabel().toLowerCase()+(s.categoryLabel?' · '+s.categoryLabel:''),icon:'🎬',run:function(){odtl(s.name)}});
  });
  // MAL My List — only if already loaded (don't hit network on palette open).
  if(S.myListData&&S.myListData.data){
    S.myListData.data.slice(0,200).forEach(function(x){
      var n=x.node;var ls=x.list_status||{};
      items.push({kind:'My List',title:n.title,sub:(ls.status||'').replace(/_/g,' ')+(ls.score?' · ★'+ls.score:''),icon:'⭐',run:function(){openExploreDetail(n.id)}});
    });
  }
  return items;
}
function _palFilter(items,q){
  if(!q)return items.slice(0,80);
  var scored=[];
  items.forEach(function(it){
    // Score across both title and kind, favoring title.
    var s=_palFuzzy(q,it.title);
    var sSub=_palFuzzy(q,it.sub||'')*.3;
    var best=Math.max(s,sSub);
    if(best>-Infinity)scored.push({it:it,score:best});
  });
  scored.sort(function(a,b){return b.score-a.score});
  return scored.slice(0,60).map(function(x){return x.it});
}
function _palGroupOrder(){return ['View','Action','Library','My List']}
function _palRender(){
  var filtered=_palFilter(_palState.items,_palState.query);
  _palState.filtered=filtered;
  if(_palState.sel>=filtered.length)_palState.sel=Math.max(0,filtered.length-1);
  var res=document.getElementById('palResults');if(!res)return;
  if(!filtered.length){res.innerHTML='<div class="pal-empty">No matches for "'+E(_palState.query)+'"</div>';return;}
  // Group by kind, preserving rank order within each group.
  var groups={};var order=_palGroupOrder();
  filtered.forEach(function(it,i){(groups[it.kind]=groups[it.kind]||[]).push({it:it,gIdx:i})});
  var h='';
  order.forEach(function(k){
    var g=groups[k];if(!g||!g.length)return;
    h+='<div class="pal-group"><div class="pal-group-label">'+E(k)+'</div>';
    g.forEach(function(x){
      var active=x.gIdx===_palState.sel;
      h+='<div class="pal-item'+(active?' active':'')+'" data-idx="'+x.gIdx+'"><div class="pal-item-icon">'+(x.it.icon||'•')+'</div>'
        +'<div class="pal-item-body"><div class="pal-item-title">'+E(x.it.title)+'</div>'
        +(x.it.sub?'<div class="pal-item-sub">'+E(x.it.sub)+'</div>':'')+'</div>'
        +'<div class="pal-item-kind">'+E(x.it.kind)+'</div></div>';
    });
    h+='</div>';
  });
  // Handle any kinds not in the declared order (defensive).
  for(var k in groups){if(order.indexOf(k)<0){
    h+='<div class="pal-group"><div class="pal-group-label">'+E(k)+'</div>';
    groups[k].forEach(function(x){
      var active=x.gIdx===_palState.sel;
      h+='<div class="pal-item'+(active?' active':'')+'" data-idx="'+x.gIdx+'"><div class="pal-item-icon">'+(x.it.icon||'•')+'</div>'
        +'<div class="pal-item-body"><div class="pal-item-title">'+E(x.it.title)+'</div>'
        +(x.it.sub?'<div class="pal-item-sub">'+E(x.it.sub)+'</div>':'')+'</div>'
        +'<div class="pal-item-kind">'+E(x.it.kind)+'</div></div>';
    });
    h+='</div>';
  }}
  res.innerHTML=h;
  // Scroll active into view
  var act=res.querySelector('.pal-item.active');
  if(act&&act.scrollIntoView)act.scrollIntoView({block:'nearest'});
}
function _palRun(item){if(!item)return;_closePalette();try{item.run&&item.run();}catch(err){console.error('[Palette] run error:',err);toast('Action failed','e');}}
function openPalette(){
  if(_palState.open)return;
  _palState.open=true;_palState.query='';_palState.sel=0;
  _palState.items=_palBuildIndex();
  var el=document.createElement('div');el.id='palOverlay';el.className='pal-overlay';
  el.innerHTML='<div class="pal-panel" onclick="event.stopPropagation()">'
    +'<div class="pal-search-wrap">'
    +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
    +'<input class="pal-input" id="palInput" placeholder="Jump to a view, series, or action..." autocomplete="off" spellcheck="false">'
    +'<span class="pal-hint">Esc</span></div>'
    +'<div class="pal-results" id="palResults"></div>'
    +'<div class="pal-footer"><span><kbd>↑↓</kbd>navigate</span><span><kbd>↵</kbd>open</span><span><kbd>Esc</kbd>close</span><span style="margin-left:auto">'+(_palState.items.length)+' items</span></div>'
    +'</div>';
  el.addEventListener('click',function(e){if(e.target===el)_closePalette();});
  document.body.appendChild(el);
  var input=document.getElementById('palInput');
  input.addEventListener('input',function(){_palState.query=input.value;_palState.sel=0;_palRender();});
  input.addEventListener('keydown',function(e){
    var filt=_palState.filtered||[];
    if(e.key==='ArrowDown'){_palState.sel=Math.min(filt.length-1,_palState.sel+1);_palRender();e.preventDefault();e.stopPropagation();}
    else if(e.key==='ArrowUp'){_palState.sel=Math.max(0,_palState.sel-1);_palRender();e.preventDefault();e.stopPropagation();}
    else if(e.key==='Enter'){_palRun(filt[_palState.sel]);e.preventDefault();e.stopPropagation();}
    else if(e.key==='Escape'){_closePalette();e.preventDefault();e.stopPropagation();}
  });
  // Click handler via delegation
  document.getElementById('palResults').addEventListener('click',function(e){
    var row=e.target.closest('.pal-item');if(!row)return;
    var idx=parseInt(row.getAttribute('data-idx'),10);
    var filt=_palState.filtered||[];
    if(!isNaN(idx)&&filt[idx])_palRun(filt[idx]);
  });
  _palRender();
  setTimeout(function(){input.focus();},10);
}
function _closePalette(){
  if(!_palState.open)return false;
  _palState.open=false;
  var el=document.getElementById('palOverlay');if(el)el.remove();
  return true;
}

// ========== 3.2 SYNC CONFLICT RESOLUTION ==========
// Awaitable modal shown when local progress < MAL progress. Resolves to one of
// 'mal', 'local', 'merge', or 'cancel'. Used by autoSyncSeries to protect
// progress made on other devices.
function promptSyncConflict(name,localEps,malEps){
  return new Promise(function(resolve){
    var resolved=false;
    function finish(choice){if(resolved)return;resolved=true;var el=document.getElementById('syncConflictOverlay');if(el)el.remove();resolve(choice);}
    var lbl=isManga()?'chapters':'episodes';
    var h='<div class="mal-edit-overlay" id="syncConflictOverlay"><div class="mal-edit-panel" style="width:440px">';
    h+='<h3 style="color:var(--yellow)">⚠ Progress conflict</h3>';
    h+='<p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px"><strong>'+E(name)+'</strong></p>';
    h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:16px">MAL has <strong style="color:var(--text-primary)">'+malEps+' '+lbl+'</strong> watched, but this device only has <strong style="color:var(--text-primary)">'+localEps+'</strong>. How should this be resolved?</p>';
    h+='<div style="display:flex;flex-direction:column;gap:8px">';
    h+='<button class="btn btn-p btn-sm" data-choice="mal">Keep MAL ('+malEps+') — adopt remote progress locally</button>';
    h+='<button class="btn btn-s btn-sm" data-choice="local">Keep Local ('+localEps+') — overwrite MAL with this device\'s count</button>';
    h+='<button class="btn btn-s btn-sm" data-choice="merge">Merge to higher ('+Math.max(localEps,malEps)+')</button>';
    h+='<button class="btn btn-g btn-sm" data-choice="cancel">Cancel — do nothing</button>';
    h+='</div></div></div>';
    var div=document.createElement('div');div.innerHTML=h;document.body.appendChild(div.firstChild);
    var overlay=document.getElementById('syncConflictOverlay');
    overlay.addEventListener('click',function(e){
      if(e.target===overlay){finish('cancel');return;}
      var btn=e.target.closest('[data-choice]');if(btn)finish(btn.getAttribute('data-choice'));
    });
  });
}

// ========== DUPLICATE FILE RESOLUTION POPUP ==========
// Lower-right popup (toast-style) with high-contrast liquid-glass styling

var _dupCurrent = null;
var _dupDismissTimer = null;

function fmtFileSize(bytes){
  if(!bytes)return '0 B';
  var k=1024,sizes=['B','KB','MB','GB','TB'];
  var i=Math.floor(Math.log(bytes)/Math.log(k));
  return (bytes/Math.pow(k,i)).toFixed(i>0?1:0)+' '+sizes[i];
}

function openDupPopup(data){
  _dupCurrent = data;
  clearTimeout(_dupDismissTimer);
  document.getElementById('dupPopupSeriesName').textContent = data.seriesName;
  document.getElementById('dupPopupEpisodeNum').textContent = data.episodeNum;
  var listEl = document.getElementById('dupPopupFilesList');
  listEl.innerHTML = '';
  data.files.forEach(function(f, idx){
    var el = document.createElement('div');
    el.className = 'dup-file-row';
    el.setAttribute('data-idx', idx);
    el.innerHTML = '<div class="dup-radio"><div class="dup-radio-dot"></div></div>'
      +'<div style="flex:1;min-width:0">'
      +'<div class="dup-fname">'+E(f.name)+'</div>'
      +'<div class="dup-meta">'
      +'<span class="dup-tag">'+E(f.codec)+'</span>'
      +'<span class="dup-tag">'+E(f.resolution)+'</span>'
      +'<span class="dup-tag">'+fmtFileSize(f.size)+'</span>'
      +'</div></div>';
    el.onclick = function(){ selectDupFile(idx); };
    listEl.appendChild(el);
  });
  selectDupFile(0);
  // Show popup with slide-in animation
  var popup = document.getElementById('dupPopup');
  popup.style.display = 'block';
  requestAnimationFrame(function(){
    popup.classList.add('open');
  });
  // Auto-dismiss after 30s if user doesn't interact
  _dupDismissTimer = setTimeout(function(){ dismissDupPopup(); }, 30000);
}

function dismissDupPopup(){
  clearTimeout(_dupDismissTimer);
  var popup = document.getElementById('dupPopup');
  popup.classList.remove('open');
  setTimeout(function(){
    popup.style.display = 'none';
    _dupCurrent = null;
    api.duplicateModalClosed();
  }, 350);
}

function selectDupFile(selectedIdx){
  if(!_dupCurrent)return;
  var rows = document.querySelectorAll('#dupPopupFilesList .dup-file-row');
  rows.forEach(function(row, idx){
    if(idx === selectedIdx){
      row.classList.add('on');
      row.setAttribute('data-selected', 'true');
    } else {
      row.classList.remove('on');
      row.setAttribute('data-selected', 'false');
    }
  });
}

function getSelectedDupFile(){
  var rows = document.querySelectorAll('#dupPopupFilesList .dup-file-row');
  for(var i=0;i<rows.length;i++){
    if(rows[i].getAttribute('data-selected')==='true') return i;
  }
  return 0;
}

async function resolveDupPreferHEVC(){
  if(!_dupCurrent)return;
  clearTimeout(_dupDismissTimer);
  var hevcIdx = _dupCurrent.files.findIndex(function(f){ return f.codec==='HEVC'; });
  if(hevcIdx < 0){ toast('No HEVC file found — use manual selection','e'); return; }
  await doResolveDuplicate(hevcIdx);
}

async function resolveDupPreferLarger(){
  if(!_dupCurrent)return;
  clearTimeout(_dupDismissTimer);
  var largestIdx = 0;
  var largestSize = _dupCurrent.files[0].size;
  _dupCurrent.files.forEach(function(f,i){
    if(f.size > largestSize){ largestSize = f.size; largestIdx = i; }
  });
  await doResolveDuplicate(largestIdx);
}

async function resolveDupManual(){
  if(!_dupCurrent)return;
  clearTimeout(_dupDismissTimer);
  var selected = getSelectedDupFile();
  await doResolveDuplicate(selected);
}

async function doResolveDuplicate(keepIdx){
  if(!_dupCurrent) return;
  var keepFile = _dupCurrent.files[keepIdx];
  var deletePaths = _dupCurrent.files.filter(function(_,i){ return i!==keepIdx; }).map(function(f){ return f.path; });
  if(deletePaths.length === 0){ dismissDupPopup(); return; }
  toast('Deleting rejected file(s)...','i');
  try {
    var results = await api.duplicateResolve({
      seriesName: _dupCurrent.seriesName,
      episodeNum: _dupCurrent.episodeNum,
      keepPath: keepFile.path,
      deletePaths: deletePaths
    });
    var deleted = results.filter(function(r){ return r.status==='deleted'; }).length;
    var errors = results.filter(function(r){ return r.status==='error'; }).length;
    if(errors > 0) toast('Deleted '+deleted+' file(s), '+errors+' error(s)','e');
    else toast('Kept: '+keepFile.name+' · Deleted '+deleted+' file(s)','s');
    dismissDupPopup();
  } catch(e){
    toast('Failed to resolve duplicate: '+e.message,'e');
  }
}

// Listen for duplicate events from main process
api.onDuplicateShowModal(function(data){
  if(notifEnabled('duplicates'))toast('Duplicate files detected for '+data.seriesName+' '+epLabel()+' '+data.episodeNum,'e');
  openDupPopup(data);
});

api.onDuplicateResolved(function(data){
  setTimeout(function(){ loadLib(); }, 500);
});

        ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(w-padR,gy);ctx.stroke();
      }
      scoreLabels.forEach(function(l,i){
        var val=scoreData[i];
        var barH=val/maxScoreCount*chartH;
        var x=padL+i*gap+gap/2-barW/2;
        var y=padT+chartH-barH;
        // Gradient fill
        var grad=ctx.createLinearGradient(0,y,0,y+barH);
        grad.addColorStop(0,'rgba(245,158,11,0.9)');
        grad.addColorStop(1,'rgba(245,158,11,0.45)');
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.roundRect(x,y,barW,barH,4);ctx.fill();
        // X label
        ctx.fillStyle='var(--fg3)';ctx.font='11px sans-serif';ctx.textAlign='center';
        ctx.fillText(l,padL+i*gap+gap/2,h-6);
        // Value label on top
        if(val>0){ctx.fillStyle='var(--fg2)';ctx.font='bold 11px sans-serif';ctx.fillText(val,padL+i*gap+gap/2,y-6);}
      });
    }
    // Status chart with color-coded bars
    if(statusCanvas){
      var ctx=statusCanvas.getContext('2d');var w=statusCanvas.width,h=statusCanvas.height;
      var padL=30,padR=10,padB=30,padT=15;
      var chartW=w-padL-padR,chartH=h-padB-padT;
      var barW=chartW/statusMeta.length*0.55;
      var gap=chartW/statusMeta.length;
      ctx.clearRect(0,0,w,h);
      // Y-axis grid lines
      for(var gi=0;gi<=4;gi++){
        var gy=padT+chartH*(gi/4);
        ctx.strokeStyle='rgba(148,163,184,0.15)';
        ctx.lineWidth=0.5;
        ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(w-padR,gy);ctx.stroke();
      }
      statusMeta.forEach(function(sm,i){
        var val=statusCounts[sm.key]||0;
        var barH=val/maxStatusCount*chartH;
        var x=padL+i*gap+gap/2-barW/2;
        var y=padT+chartH-barH;
        // Color-coded gradient
        var grad=ctx.createLinearGradient(0,y,0,y+barH);
        grad.addColorStop(0,sm.color);
        grad.addColorStop(1,sm.bg.replace(/[\d.]+\)$/,'0.35)'));
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.roundRect(x,y,barW,barH,4);ctx.fill();
        // X label (rotated if needed)
        ctx.fillStyle='var(--fg3)';ctx.font='10px sans-serif';ctx.textAlign='center';
        var label=sm.label.length>8?sm.label.substring(0,7)+'.':sm.label;
        ctx.fillText(label,padL+i*gap+gap/2,h-8);
        // Value label
        if(val>0){ctx.fillStyle=sm.color;ctx.font='bold 11px sans-serif';ctx.fillText(val,padL+i*gap+gap/2,y-6);}
      });
    }
  },50);
  if(Object.keys(byCat).length>0){
    h+='<div style="margin-bottom:24px"><div style="font-size:16px;font-weight:700;margin-bottom:12px">By Category</div>';
    h+='<div style="display:flex;flex-direction:column;gap:8px">';
    Object.keys(byCat).sort().forEach(function(c){
      h+='<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-raised);border-radius:var(--radius-sm);border:1px solid var(--border)"><div style="flex:1;font-size:13px;font-weight:600">'+E(c)+'</div><div style="font-size:14px;font-weight:700;color:var(--accent)">'+byCat[c]+'</div></div>';
    });
    h+='</div></div>';
  }
  h+='<div style="margin-bottom:24px"><div style="font-size:16px;font-weight:700;margin-bottom:12px">By Status</div>';
  h+='<div style="display:flex;flex-direction:column;gap:8px">';
  statusMeta.forEach(function(sm){
    var count=statusCounts[sm.key]||0;
    if(count>0){
      h+='<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-raised);border-radius:var(--radius-sm);border:1px solid var(--border);border-left:3px solid '+sm.color+'">';

      h+='<div style="font-size:14px;font-weight:700;color:'+sm.color+'">'+count+'</div>';
      h+='</div>';
    }
  });
  h+='</div></div>';
  h+='</div>';
  return h;
}
