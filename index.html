<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: cover: blob:; font-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<title>AnimeVault</title>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/views.css">
</head>
<body>
<div class="ambient" id="ambient" aria-hidden="true"></div>
<div class="bg-animation-container" id="bgAnimationContainer" aria-hidden="true"></div>

<header class="titlebar">
  <div class="tb-left">
    <button class="tb-icon" data-act="toggleSidebar" data-tip="Toggle sidebar (Ctrl+B)" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="17" rx="3.5"/><path d="M9.5 3.5v17"/></svg></button>
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a.9.9 0 0 0 1.37.77l10.9-6.8a.9.9 0 0 0 0-1.54L9.37 4.43A.9.9 0 0 0 8 5.2z"/></svg></span><span id="appTitle">AnimeVault</span></div>
    <div class="seg seg-mode" id="modeSeg" data-seg="mode" data-no-auto role="tablist" aria-label="Library mode">
      <button data-mode="anime" class="active" data-act="switchMode" data-arg="[&quot;anime&quot;]">Anime</button>
      <button data-mode="manga" data-act="switchMode" data-arg="[&quot;manga&quot;]">Manga</button>
    </div>
  </div>
  <div class="tb-center">
    <button class="tb-search" data-act="openPalette" aria-label="Search and commands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.6-4.6"/></svg><span>Search your library or jump to…</span><kbd>Ctrl K</kbd></button>
  </div>
  <div class="tb-right">
    <button class="tb-pill" data-act="toggleLumaAssistant" data-tip="Chat with Luma"><img src="luma/luma-front.png" alt="">Luma</button>
    <button class="tb-icon" id="tbActivity" data-act="openActivityCenter" data-tip="Background activity" aria-label="Background activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 8.5L9 3.5 6 12H2"/></svg><span class="tb-dot"></span></button>
    <div class="win-ctrls">
      <button class="win-btn" data-act="winMin" aria-label="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14"/></svg></button>
      <button class="win-btn" data-act="winMax" aria-label="Maximize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5.5" y="5.5" width="13" height="13" rx="1.5"/></svg></button>
      <button class="win-btn close" data-act="winClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</header>

<div class="app">
  <nav class="sidebar" aria-label="Main">
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">
      <button class="sync-chip" id="syncToggle" data-act="toggleSync" data-state="off"><span class="md" id="malDot"></span><span class="sync-label" id="malTxt">MyAnimeList</span></button>
      <div class="foot-btns">
        <button class="icon-btn" id="themeToggleBtn" data-act="toggleQuickTheme" data-tip="Switch theme" aria-label="Switch light or dark theme"></button>
        <button class="icon-btn" data-act="showKeyboardHelp" data-tip="Keyboard shortcuts (Shift+?)" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M10 13h4M7 16h10"/></svg></button>
      </div>
    </div>
  </nav>
  <main class="mc" id="mc" tabindex="-1"></main>
</div>

<div class="dov" id="dov"><div class="dbk"></div><div class="dpn" id="dpn" role="dialog" aria-modal="true"></div></div>
<div id="modalRoot"></div>
<div class="tc" id="tc" aria-live="polite"></div>
<div id="setupWizard"></div>

<script src="renderer/core.js"></script>
<script src="renderer/helpers.js"></script>
<script src="renderer/theme.js"></script>
<script src="renderer/data.js"></script>
<script src="renderer/app.js"></script>
<script src="renderer/library.js"></script>
<script src="renderer/detail.js"></script>
<script src="renderer/explore.js"></script>
<script src="renderer/schedule.js"></script>
<script src="renderer/stats.js"></script>
<script src="renderer/hub.js"></script>
<script src="renderer/filemgmt.js"></script>
<script src="renderer/mal.js"></script>
<script src="renderer/settings.js"></script>
<script src="renderer/appearance.js"></script>
<script src="renderer/luma.js"></script>
<script src="renderer/setup.js"></script>
<script src="renderer/bootstrap.js"></script>
</body>
</html>
