<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../../extension/icons/icon48.png" alt="">
    <h1>Manga Translator</h1>
  </header>

  <div id="status" class="status"><span class="dot"></span><span id="status-text">Starting…</span></div>

  <section>
    <label class="row switch">
      <span>Auto-translate on <b id="host">this site</b></span>
      <input type="checkbox" id="site-enabled">
    </label>
    <div class="buttons">
      <button id="translate-now">Translate this page once</button>
      <button id="retry-failed" class="secondary" title="Retry every image that shows an error">Retry failed</button>
    </div>
    <label class="row switch">
      <span>Show translations <kbd>Alt+Shift+T</kbd></span>
      <input type="checkbox" id="show-overlay">
    </label>
    <label class="row size">
      <span>Text size <output id="text-scale-value">100%</output></span>
      <input type="range" id="text-scale" min="50" max="125" step="5">
    </label>
  </section>

  <section class="grid">
    <label>From
      <select id="src-lang">
        <option value="auto">Auto-detect</option>
        <option value="ja">Japanese</option>
        <option value="zh">Chinese</option>
        <option value="ko">Korean</option>
      </select>
    </label>
    <label>To
      <select id="tgt-lang">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="pt">Portuguese</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="ru">Russian</option>
        <option value="vi">Vietnamese</option>
        <option value="id">Indonesian</option>
      </select>
    </label>
  </section>

  <details>
    <summary>Advanced</summary>
    <label class="field">Gemini API key <input id="gemini-key" type="password" placeholder="Paste your key" autocomplete="off" spellcheck="false"> <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Get a free key ↗</a></label>
    <label class="field">OpenRouter API key <small>(optional: translates with Claude Haiku 5.5 instead of Gemini)</small> <input id="openrouter-key" type="password" placeholder="Paste your key" autocomplete="off" spellcheck="false"> <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">Get a key ↗</a></label>
    <label>Min. image size (px) <input id="min-size" type="number" min="100" max="2000" step="50"></label>
  </details>

  <script src="../mock-chrome.js"></script>
  <script type="module" src="../../extension/popup.js"></script>
</body>
</html>
