name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows runs the same suites, so drive letters, backslash paths and
    # cross-drive moves are checked where the app actually runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The suites never launch Electron; skip its ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
